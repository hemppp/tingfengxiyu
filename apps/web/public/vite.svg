  <path d="M 16 10 L 16 10.5" stroke="#1a3028" stroke-width="3" stroke-linecap="round"/>
  <path d="M 16 18 L 16 18.5" stroke="#1a3028" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 竹叶 -->
  <path d="M 16 8 Q 20 6 22 8 Q 20 9 16 8" fill="#3a5a40" opacity="0.8"/>
  <path d="M 16 14 Q 12 12 10 14 Q 12 15 16 14" fill="#3a5a40" opacity="0.8"/>
  <path d="M 16 20 Q 20 18 22 20 Q 20 21 16 20" fill="#3a5a40" opacity="0.8"/>
