<!DOCTYPE html>
<!--
  ★ 首屏初始 data-theme 写 shuimo（2026-09-19）：
    与 themeStore 的默认主题保持一致，避免"先按错误主题画一帧再被 JS 改掉"的闪烁。
    这里原先写的是 `emerald` —— 一个全仓已无定义的陈旧值（改主题体系时的残留），
    它不匹配任何 CSS，首屏实际回落 :root，再被 applyStoredTheme() 覆盖。
    ⚠️ 若用户在 localStorage 里选了别的主题，applyStoredTheme() 会覆盖本属性，无需改这里。
-->
<html lang="zh-CN" data-theme="shuimo">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>听风细雨 - 伴写小说工具</title>

    <!-- 主题已固定为亮色「晨雾」模式，无暗色切换 -->

    <!-- Noto Serif SC — 中文衬线主字体（文人气质） -->
    <!-- 使用 local() 引用系统字体，避免 Google Fonts 被墙的问题 -->
    <!-- 若系统未安装，fallback 到 Source Han Serif SC / 宋体 / serif -->

    <style>
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/PressStart2P-Regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Zpix';
        src: local('SimSun'), local('宋体');
      }
    </style>
  </head>
  <body class="text-foreground" style="background: transparent;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
