<!DOCTYPE html>
<!--
  ★ 首屏初始 data-theme 写 vscode-dark-modern：
    与 themeStore 的默认主题（DEFAULT_THEME）保持一致，避免"先按错误主题画一帧
    再被 JS 改掉"的闪烁。该主题即 :root 本身（ADR §6.1），所以即便本属性缺失，
    首屏也会直接落到 VS Code Dark Modern 的 token 上。
    ⚠️ 若用户在 localStorage 里选了别的值，applyStoredTheme() 会覆盖本属性，无需改这里。
-->
<html lang="zh-CN" data-theme="vscode-dark-modern" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>听风细雨 - 伴写小说工具</title>

    <!-- 主题固定为 VS Code Dark Modern（暗色，无明暗切换） -->

    <!-- Noto Serif SC — 中文衬线主字体（文人气质） -->
    <!-- 使用 local() 引用系统字体，避免 Google Fonts 被墙的问题 -->
    <!-- 若系统未安装，fallback 到 Source Han Serif SC / 宋体 / serif -->

    <style>
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/PressStart2P-Regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Zpix';
        src: local('SimSun'), local('宋体');
      }
    </style>
  </head>
  <body class="text-foreground" style="background: transparent;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
