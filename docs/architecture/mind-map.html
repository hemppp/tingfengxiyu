var MODE = { manual:{n:'手写台',c:'#c084fc'}, auto:{n:'自动台',c:'#4fa8ff'}, shared:{n:'共享面',c:'#4ade80'} };
var NODE_H = 34, ROOT_H = 40, GAP_Y = 13, COL_GAP = 46, ROOT_W = 236;
var S = 'http://www.w3.org/2000/svg';

var svg = document.getElementById('svg');
var badge = document.getElementById('badge');
var detail = document.getElementById('detail');

function el(name, attrs, text){
  var n = document.createElementNS(S, name);
  if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}
function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ── 预处理：父子、模式、颜色、编号 ── */
var all = [], branches = [], byIdAll = {}, seq = 0;
(function prep(o, p, depth){
  o._p = p; o._d = depth;
  o.mode = o.mode || (p ? p.mode : 'shared');
  o.note = o.note || '';
  o._kids = o.c || []; delete o.c;
  o._id = 'n' + (++seq);
  if (depth === 0){ o._color = '#6b8cff'; o.side = 'r'; }
  else if (depth === 1){ o._color = o.color || '#6b8cff'; o.side = o.side === 'l' ? 'l' : 'r'; branches.push(o); }
  else { o._color = p._color; o.side = p.side; }
  o.collapsed = depth >= 1 && !o.open && o._kids.length > 0;
  all.push(o); byIdAll[o._id] = o;
  o._kids.forEach(function(k){ prep(k, o, depth + 1); });
})(TREE, null, 0);

var visMode = 'all', query = '', sel = null;
var vis = [], byId = {}, lastBox = null, tx = 0, ty = 0, sc = 1, hov = [];

function modOk(o){ return visMode === 'all' || o.mode === visMode || o.mode === 'shared'; }
function kidsOn(o){
  var ks = o._kids.filter(modOk);
  if (query) return ks;                       /* 搜索时强制全展开 */
  return o.collapsed ? [] : ks;
}
function textW(s){
  var w = 0;
  for (var i = 0; i < s.length; i++) w += s.charCodeAt(i) > 0x2e80 ? 13 : 7.6;
  return w;
}
function nodeW(o){ return Math.min(340, Math.max(74, Math.round(textW(o.t) + 30))); }

/* ── 布局：两侧分列，纵向按叶子顺序排，父节点取子节点中点 ── */
function layout(){
  vis = []; byId = {}; sel = sel || null;
  var q = query.toLowerCase(), hits = 0;

  TREE._x = -ROOT_W / 2; TREE._y = -ROOT_H / 2; TREE._w = ROOT_W; TREE._h = ROOT_H;
  TREE._hit = !q || (TREE.t + ' ' + TREE.ev).toLowerCase().indexOf(q) >= 0;
  vis.push(TREE); byId[TREE._id] = TREE;

  var maxW = { r:{}, l:{} }, maxD = { r:0, l:0 };
  function collect(o, depth){
    o._d2 = depth; o._w = nodeW(o); o._h = NODE_H;
    var hay = (o.t + ' ' + o.ev + ' ' + o.note).toLowerCase();
    o._hit = !q || hay.indexOf(q) >= 0;
    if (q && o._hit) hits++;
    var m = maxW[o.side];
    m[depth] = Math.max(m[depth] || 0, o._w);
    if (depth > maxD[o.side]) maxD[o.side] = depth;
    o._ks = kidsOn(o).map(function(k){ return collect(k, depth + 1); });
    vis.push(o); byId[o._id] = o;
    return o;
  }
  branches.forEach(function(b){ if (modOk(b)) collect(b, 1); });
  TREE._ks = branches.filter(modOk);          /* 根的子枝＝可见主干；nodeG/hover 要读它 */

  var xs = { r:{}, l:{} }, d, acc;
  acc = ROOT_W / 2;
  for (d = 1; d <= maxD.r; d++){ acc += COL_GAP; xs.r[d] = acc; acc += (maxW.r[d] || 0); }
  acc = ROOT_W / 2;
  for (d = 1; d <= maxD.l; d++){ acc += COL_GAP; xs.l[d] = -acc - (maxW.l[d] || 0); acc += (maxW.l[d] || 0); }

  var cur = { r:0, l:0 };
  function place(o, depth){
    o._x = (o.side === 'r' ? xs.r[depth] : xs.l[depth]);
    if (!o._ks.length){ o._y = cur[o.side]; cur[o.side] += NODE_H + GAP_Y; return o._y; }
    o._ks.forEach(function(k){ place(k, depth + 1); });
    o._y = (o._ks[0]._y + o._ks[o._ks.length - 1]._y) / 2;
    return o._y;
  }
  branches.forEach(function(b){ if (modOk(b)) place(b, 1); });

  ['r', 'l'].forEach(function(side){
    var lo = Infinity, hi = -Infinity;
    vis.forEach(function(o){ if (o._d >= 1 && o.side === side){ lo = Math.min(lo, o._y); hi = Math.max(hi, o._y + NODE_H); } });
    if (!isFinite(lo)) return;
    var off = (lo + hi) / 2;
    vis.forEach(function(o){ if (o._d >= 1 && o.side === side) o._y -= off; });
  });

  var bx = Infinity, bxx = -Infinity, by = Infinity, byy = -Infinity;
  vis.forEach(function(o){
    bx = Math.min(bx, o._x); bxx = Math.max(bxx, o._x + o._w);
    by = Math.min(by, o._y); byy = Math.max(byy, o._y + o._h);
  });
  lastBox = { bx:bx, bxx:bxx, by:by, byy:byy, hits:hits };
  return lastBox;
}

function link(p, c){
  var py = p._y + p._h / 2, cy = c._y + c._h / 2, px, cx, s = c.side === 'r' ? 1 : -1;
  if (s === 1){ px = p._x + p._w; cx = c._x; } else { px = p._x; cx = c._x + c._w; }
  var k = Math.max(22, Math.abs(cx - px) * 0.42);
  return 'M ' + px + ',' + py + ' C ' + (px + k * s) + ',' + py + ' ' + (cx - k * s) + ',' + cy + ' ' + cx + ',' + cy;
}

function nodeG(o){
  var g = el('g', { 'class':'node' + (o._d === 0 ? ' root' : '') + (o._hit ? '' : ' dim') + (sel === o._id ? ' sel' : '') });
  g.appendChild(el('rect', { x:o._x, y:o._y, width:o._w, height:o._h, rx:9, 'class':'box' }));
  g.appendChild(el('rect', { x:o._x, y:o._y, width:4, height:o._h, rx:2, fill:o._color }));
  g.appendChild(el('text', { x:o._x + 13, y:o._y + o._h / 2 + 4.6, 'class':'tt' + (textW(o.t) > o._w - 26 ? ' sm' : '') }, o.t));
  if (o._kids.length){
    var open = o._ks.length > 0;
    var cnt = o._kids.filter(modOk).length;
    g.appendChild(el('text', {
      x: o.side === 'r' ? o._x + o._w + 11 : o._x - 11,
      y: o._y + o._h / 2 + 4,
      'class':'ex' + (open ? ' open' : ''),
      'text-anchor': o.side === 'r' ? 'start' : 'end'
    }, open ? '–' : '+' + cnt));
  }
  g.appendChild(el('title', null, o.t + (o._d ? '\n模式：' + MODE[o.mode].n : '')
    + (o.ev ? '\n依据：' + o.ev : '') + (o.note ? '\n' + o.note : '')));
  o._g = g;
  g.addEventListener('click', function(ev){ if (ev.stopPropagation) ev.stopPropagation(); onClick(o); });
  g.addEventListener('dblclick', function(ev){ if (ev.stopPropagation) ev.stopPropagation(); zoomTo(o); });
  g.addEventListener('mouseenter', function(){ hover(o); });
  g.addEventListener('mouseleave', unhover);
  return g;
}

function unhover(){
  hov.forEach(function(x){ if (x._g) x._g.classList.remove('path'); });
  hov = [];
}
function hover(o){
  unhover();
  var p = o;
  while (p){ if (p._g){ p._g.classList.add('path'); hov.push(p); } p = p._p; }
  o._ks.forEach(function(k){ if (k._g){ k._g.classList.add('path'); hov.push(k); } });
}

function apply(){
  var r = svg.querySelector('#root');
  if (r) r.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + sc + ')');
}
function sizeView(){
  var vw = svg.clientWidth || 1200, vh = svg.clientHeight || 620;
  svg.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
}
function draw(){
  var box = layout();
  svg.innerHTML = '';
  var root = el('g', { id:'root' });
  svg.appendChild(root);
  var gL = el('g'), gN = el('g');
  root.appendChild(gL); root.appendChild(gN);

  vis.forEach(function(o){
    if (o._d === 0) return;
    if (!o._p || !byId[o._p._id]) return;
    gL.appendChild(el('path', { d:link(o._p, o), 'class':'link', stroke:o._color }));
  });
  vis.forEach(function(o){ gN.appendChild(nodeG(o)); });

  root.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + sc + ')');
  badge.textContent = '可见 ' + vis.length + ' / ' + all.length + ' 个节点 · ' + branches.filter(modOk).length + ' 条主干'
    + (query ? ' · 命中 ' + box.hits + ' 个' : '')
    + (visMode === 'all' ? '' : ' · 只看' + MODE[visMode].n);
}

function fit(){
  if (!lastBox) return;
  var vw = svg.clientWidth || 1200, vh = svg.clientHeight || 620, pad = 34;
  var w = Math.max(1, lastBox.bxx - lastBox.bx), h = Math.max(1, lastBox.byy - lastBox.by);
  sc = Math.min((vw - pad * 2) / w, (vh - pad * 2) / h);
  if (!isFinite(sc) || sc <= 0) sc = 1;
  sc = Math.max(0.12, Math.min(sc, 1.5));
  tx = -lastBox.bx * sc + (vw - w * sc) / 2;
  ty = -lastBox.by * sc + (vh - h * sc) / 2;
  apply();
}
function home(){
  var vw = svg.clientWidth || 1200, vh = svg.clientHeight || 620;
  sc = 1; tx = vw / 2; ty = vh / 2;
  apply();
}
function zoomTo(o){
  var vw = svg.clientWidth || 1200, vh = svg.clientHeight || 620;
  tx = vw / 2 - (o._x + o._w / 2) * sc;
  ty = vh / 2 - (o._y + o._h / 2) * sc;
  apply();
}

/* ── 选择 / 详情 ── */
function onClick(o){
  if (o._d >= 1 && o._kids.length) o.collapsed = !o.collapsed;
  sel = o._id;
  draw();
  showDetail(o);
}
function reveal(o){
  var p = o._p;
  while (p){ p.collapsed = false; p = p._p; }
  query = ''; document.getElementById('q').value = '';
  sel = o._id;
  table(); draw(); zoomTo(o); showDetail(o);
}
function bindGo(scope){
  Array.prototype.forEach.call(scope.querySelectorAll('[data-go]'), function(a){
    a.addEventListener('click', function(){
      var o = byIdAll[a.getAttribute('data-go')];
      if (o) reveal(o);
    });
  });
}
function showDetail(o){
  var path = [], p = o._p;
  while (p){ path.unshift(p); p = p._p; }
  var h = ['<h4>' + esc(o.t) + '</h4>'];
  h.push('<div class="row"><span class="pill" style="border-color:' + MODE[o.mode].c + '">' + MODE[o.mode].n + '</span>'
    + (o._kids.length
        ? '<span class="pill">' + o._kids.filter(modOk).length + ' 个子项' + (o.collapsed ? ' · 已收起' : '') + '</span>'
        : '<span class="pill">叶子</span>') + '</div>');
  if (path.length) h.push('<div class="row"><span class="lbl">路径</span>'
    + path.map(function(x){ return '<a data-go="' + x._id + '">' + esc(x.t) + '</a>'; }).join(' › ') + '</div>');
  if (o.ev) h.push('<div class="row"><span class="lbl">依据</span><span class="ev">' + esc(o.ev) + '</span></div>');
  if (o.note) h.push('<div class="row">' + esc(o.note) + '</div>');
  if (o._kids.length) h.push('<div class="row"><span class="lbl">子项</span>'
    + o._kids.map(function(k){ return '<a data-go="' + k._id + '">' + esc(k.t) + '</a>'; }).join(' · ') + '</div>');
  h.push('<div class="row" style="color:#63719a">再次点击方块可收放它的子枝。</div>');
  detail.innerHTML = h.join('');
  bindGo(detail);
}
function help(){
  var h = ['<h4>思维图 · 怎么看</h4>',
    '<p>中心是根主题，两侧是 <b>' + branches.length + '</b> 条主干。点方块收放子枝（<span class="ev">+N</span> 是收起的分支数）；点下面的主干名可直接跳过去。</p>',
    '<p>悬停方块会亮出「根 → 它」的路径，看清它挂在哪条主线下；<b>双击</b>方块把视图对准它。</p>',
    '<h4>主干一览（点即跳转）</h4>'];
  branches.forEach(function(b){
    var n = 0;
    (function cnt(o){ n++; o._kids.forEach(cnt); })(b);
    h.push('<div class="bl"><i style="background:' + b._color + '"></i><span><a data-go="' + b._id + '">'
      + esc(b.t) + '</a> <span class="ev">' + n + ' 节点</span></span></div>');
  });
  h.push('<h4>模式图例</h4>');
  Object.keys(MODE).forEach(function(k){
    h.push('<div class="bl"><i style="background:' + MODE[k].c + '"></i><span>' + MODE[k].n + '</span></div>');
  });
  h.push('<p>「共享面」在两种模式下都显示；切到「手写台」或「自动台」只影响模块自己的节点。</p>');
  detail.innerHTML = h.join('');
  bindGo(detail);
}

/* ── 底部索引表 ── */
function table(){
  var t = document.getElementById('nodes');
  var rows = ['<thead><tr><th style="width:58px">层级</th><th>节点</th><th style="width:120px">模式</th>'
    + '<th>依据（文件:行号）</th></tr></thead><tbody>'];
  all.forEach(function(o){
    if (!modOk(o)) return;
    rows.push('<tr class="nr" data-id="' + o._id + '">'
      + '<td class="mono">L' + o._d + '</td>'
      + '<td style="padding-left:' + (8 + o._d * 16) + 'px">' + esc(o.t) + '</td>'
      + '<td><span class="pill" style="border-color:' + MODE[o.mode].c + '">' + MODE[o.mode].n + '</span></td>'
      + '<td class="ev">' + esc(o.ev || '—') + '</td></tr>');
  });
  rows.push('</tbody>');
  t.innerHTML = rows.join('');
  Array.prototype.forEach.call(t.querySelectorAll('tr.nr'), function(tr){
    tr.addEventListener('click', function(){
      var o = byIdAll[tr.getAttribute('data-id')];
      if (o) reveal(o);
    });
  });
}

/* ── 交互 ── */
document.getElementById('q').addEventListener('input', function(ev){
  query = String(ev.target.value || '').trim().toLowerCase();
  draw(); fit();
});
Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function(b){
  b.addEventListener('click', function(){
    visMode = b.getAttribute('data-mode');
    Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function(o){ o.classList.toggle('on', o === b); });
    table(); draw(); fit();
  });
});
Array.prototype.forEach.call(document.querySelectorAll('[data-lv]'), function(b){
  b.addEventListener('click', function(){
    var lv = b.getAttribute('data-lv');
    all.forEach(function(o){
      if (!o._kids.length) return;
      o.collapsed = (lv === 'all') ? false : (o._d >= Number(lv));
    });
    query = ''; document.getElementById('q').value = '';
    draw(); fit();
  });
});
Array.prototype.forEach.call(document.querySelectorAll('[data-z]'), function(b){
  b.addEventListener('click', function(){
    var z = b.getAttribute('data-z');
    if (z === 'fit') fit();
    else if (z === 'reset') home();
    else if (z === 'in'){ sc = Math.min(sc * 1.18, 4); apply(); }
    else { sc = Math.max(sc / 1.18, 0.12); apply(); }
  });
});
document.addEventListener('keydown', function(ev){
  if (ev.target && /input|textarea/i.test(ev.target.tagName)) return;
  var k = ev.key;
  if (k === 'Escape'){ sel = null; draw(); help(); }
  else if (k === 'f') fit();
  else if (k === 'e') all.forEach(function(o){ if (o._kids.length) o.collapsed = false; }), draw(), fit();
  else if (k === 'c') all.forEach(function(o){ if (o._kids.length) o.collapsed = o._d >= 2; }), draw(), fit();
  else if (k === '1' || k === '2' || k === '3'){
    var m = k === '1' ? 'all' : (k === '2' ? 'manual' : 'auto');
    Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function(o){
      if (o.getAttribute('data-mode') === m) o.click();
    });
  }
});
svg.addEventListener('wheel', function(ev){
  ev.preventDefault();
  if (ev.ctrlKey){
    var r = svg.getBoundingClientRect();
    var mx = ev.clientX - r.left, my = ev.clientY - r.top;
    var ns = Math.max(0.12, Math.min(4, sc * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
    tx = mx - (mx - tx) * (ns / sc);
    ty = my - (my - ty) * (ns / sc);
    sc = ns;
  } else {
    tx -= ev.deltaX;
    ty -= ev.deltaY;
  }
  apply();
}, { passive:false });
window.addEventListener('resize', function(){ sizeView(); fit(); });

/* ── 启动 ── */
sizeView();
table();
draw();
fit();
help();
})();
</script>
