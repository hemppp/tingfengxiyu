name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 防止并发流水线互相踩踏
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Type Check / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5：v4 等旧版 action 仍声明 Node 20，在 Node 24 runner 上会刷
        # "Node.js 20 is deprecated" 告警（2026-10-09 实测）
        uses: actions/checkout@v5

      - name: Setup pnpm
        # ★ 不要写 with.version —— package.json 已有 packageManager（pnpm@11.8.0），
        #   两处同时指定会被 action-setup 直接拒绝：
        #   "Multiple versions of pnpm specified: version 11 ... / pnpm@11.8.0+sha512..."
        #   失败于本步（约 5~8 秒），使 2026-10-06 起每次 push 的 CI 均为红。
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # onlyBuiltDependencies 含 better-sqlite3 / esbuild，确保原生模块可构建
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -r type-check

      - name: Lint
        run: pnpm -r lint

      - name: Test
        # 当前仅 apps/web 有 Vitest；server/agents 补测试后自动纳入
        run: pnpm -r test
