name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 防止并发流水线互相踩踏
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Type Check / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5：v4 等旧版 action 仍声明 Node 20，在 Node 24 runner 上会刷
        # "Node.js 20 is deprecated" 告警（2026-10-09 实测）
        uses: actions/checkout@v5

      - name: Setup pnpm
        # ★ 不要写 with.version —— package.json 已有 packageManager（pnpm@11.8.0），
        #   两处同时指定会被 action-setup 直接拒绝：
        #   "Multiple versions of pnpm specified: version 11 ... / pnpm@11.8.0+sha512..."
        #   失败于本步（约 5~8 秒），使 2026-10-06 起每次 push 的 CI 均为红。
        # v5：运行时 node24（v4 声明 Node 20，在 Node 24 runner 上刷 deprecation 告警）
        uses: pnpm/action-setup@v5

      - name: Setup Node
        # v5：运行时 node24（v4 声明 Node 20，在 Node 24 runner 上刷 deprecation 告警）
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # onlyBuiltDependencies 含 better-sqlite3 / esbuild，确保原生模块可构建
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -r type-check

      - name: Lint
        run: pnpm -r lint

      - name: Test
        # `pnpm -r test` 覆盖所有带 test 脚本的包（当前：apps/web、packages/core；
        # server / agents 补测试后自动纳入）。注意 packages/core 也在其中 ——
        # 2026-10-09 的 Test 步红就是它缺 @rollup/rollup-linux-x64-gnu 触发的。
        run: pnpm -r test
